
name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All project files exist"

      - name: Test HTML references
        run: |
          grep -q 'style.css' index.html
          grep -q 'script.js' index.html
          echo "HTML references verified"
